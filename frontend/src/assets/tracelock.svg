    <path d="M160 245 C160 120 352 120 352 245"/>
    <path d="M145 272 C145 98 367 98 367 272"/>
    <path d="M185 265 C185 180 327 180 327 265"/>
    <path d="M205 288 C205 215 307 215 307 288"/>

